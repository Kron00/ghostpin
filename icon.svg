<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ghostpin app icon. A map pin that is also a ghost: cream on slate night.
       Laid out on the macOS 1024 grid (824px tile, 100px inset). Rendered to
       icon.png (app bundle) and static/icon.png (in-app mark, tile only). -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2536"/>
      <stop offset="1" stop-color="#101824"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect id="tile" x="100" y="100" width="824" height="824" rx="186" fill="url(#night)" filter="url(#lift)"/>
  <path fill="#EFE3C8" d="M512 236c-124 0-218 94-218 216 0 158 218 346 218 346s218-188 218-346c0-122-94-216-218-216z"/>
  <ellipse cx="456" cy="440" rx="30" ry="40" fill="#131C2A"/>
  <ellipse cx="568" cy="440" rx="30" ry="40" fill="#131C2A"/>
</svg>
